
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Student Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eef2ff, #dbeafe);
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: min(90%, 400px);
            padding: 35px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #4f46e5;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #1f2937;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #a5b4fc;
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        #message {
            color: #dc2626;
            text-align: center;
            margin-top: 14px;
            font-size: 14px;
        }

        .note {
            margin-top: 20px;
            font-size: 12px;
            line-height: 1.5;
            color: #6b7280;
            text-align: center;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="logo">TaskFlow</div>
        <h1>Student Login</h1>
        <p class="subtitle">Sign in to manage your tasks</p>

        <form id="loginForm">
            <label for="username">Username</label>
            <input
                id="username"
                name="username"
                type="text"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Login</button>
            <p id="message" role="alert"></p>
        </form>

        <p class="note">
            Demonstration login: any non-empty username and password
            will work. This is not secure authentication.
        </p>
    </main>

    <script>
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            if (!username || !password.trim()) {
                message.textContent =
                    "Please enter both username and password.";
                return;
            }

            sessionStorage.setItem("taskflowUsername", username);
            window.location.href = "/index.html";
        });
    </script>
</body>
</html>
