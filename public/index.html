
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Dashboard</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js" defer></script>
</head>

<body>
    <header class="topbar">
        <a class="brand" href="/index.html">TaskFlow</a>

        <div class="profile-section">
            <div class="profile">
                <div class="profile-avatar" id="userAvatar">S</div>

                <div class="profile-info">
                    <strong id="displayUsername">Student</strong>
                    <small>Student account</small>
                </div>
            </div>

            <button
                id="logoutButton"
                type="button"
                class="logout-button"
            >
                Logout
            </button>
        </div>
    </header>

    <main class="container">
        <section class="welcome">
            <p class="eyebrow">STUDENT WORKSPACE</p>
            <h1>My Dashboard</h1>
            <p>Organize your work and keep track of your progress.</p>
        </section>

        <section class="stats">
            <article class="stat-card">
                <span>Total Tasks</span>
                <strong id="totalTasks">0</strong>
            </article>

            <article class="stat-card">
                <span>Completed</span>
                <strong id="completedTasks">0</strong>
            </article>

            <article class="stat-card">
                <span>Pending</span>
                <strong id="pendingTasks">0</strong>
            </article>
        </section>

        <section class="task-panel">
            <h2>Add a New Task</h2>

            <form id="taskForm" class="task-form">
                <input
                    id="taskTitle"
                    type="text"
                    placeholder="Enter your task..."
                    maxlength="200"
                    required
                >
                <button type="submit">Add Task</button>
            </form>

            <p id="taskMessage" role="status"></p>
        </section>

        <section class="task-panel">
            <h2>My Tasks</h2>
            <ul id="taskList" class="task-list"></ul>
            <p id="emptyMessage">No tasks yet. Add your first task!</p>
        </section>
    </main>

    <footer>
        Student Task Manager · Automated CI/CD Project
    </footer>
</body>
</html>
